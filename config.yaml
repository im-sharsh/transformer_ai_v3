# Transaction Data Intelligence: configuration.
# Column hints are optional: leave them null and the framework detects roles from the data.
# Sections marked "later phase" are placeholders and are not used yet.

project:
  seed: 42
  data_dir: data
  experiments_dir: experiments
  reports_dir: reports

data:
  target: null            # e.g. is_fraud, churn
  task: null              # binary_classification | multiclass_classification | regression; null = detect
  entity_column: null     # e.g. cc_num, customer_id (used for history features)
  datetime_column: null   # event time (used for temporal splits and features)
  amount_column: null     # e.g. amt (used for E2 history/velocity features); null = detect from column names
  category_column: null   # e.g. category
  merchant_column: null   # e.g. merchant

upload:
  save_uploads_to: data/raw   # uploaded files are stored here unchanged

schema:
  sample_size: 20000      # rows sampled for value-based detection (all rows are used for counts)

profiling:
  sample_above_rows: 500000   # above this size the UI offers profiling a reproducible sample
  sample_rows: 200000
  top_k: 5
  rare_threshold: 0.001       # categories below this share are reported as rare
  skew_warning: 2.0

quality:
  weights: null                # null = default weights (completeness .25, validity .25, consistency .20,
                                # uniqueness .15, integrity .15); a dimension with no applicable checks is
                                # excluded and the rest are re-weighted, never scored as 100
  large_dataset_warn_rows: 300000   # above this, the UI warns that quality analysis may take a while

preprocessing:                 # basic preprocessing (Phase 2): stateless, safe before any train/test split
  drop_systematic_redundant_columns: true
  drop_row_index: true
  drop_constant_columns: true
  convert_types: true
  zero_pad_codes: true
  normalize_whitespace: true
  merge_case_variants: true
  strip_shared_prefixes: true
  invalid_value_policy: nullify      # nullify | quarantine
  quarantine_missing_mandatory: true
  duplicate_policy: remove           # remove | quarantine | retain

subsets:                   # Phase 3 (Processing): reproducible subset sizes offered in the UI
  options: [10000, 50000, 100000, 200000, 500000, full]
  cpu_default: 10000

split:                     # Phase 3: train/validation/test assignment, shared by every level
  method: temporal         # temporal when a datetime column exists, otherwise falls back to random
  fractions: [0.70, 0.15, 0.15]

sampling:                  # Phase 3: fixed experiment sample per split, drawn once and reused by every level
  train_positive_share: 0.10     # oversample the positive class in train/validation so small subsets still see it
  validation_positive_share: 0.10
  keep_all_test_positives: true  # test keeps every positive it can (up to max_test_positive_share) for reliable metrics
  max_test_positive_share: 0.5

processing:                # Phase 3: E1 / E2 train-fitted transforms (missing values, rare categories, numeric)
  rare_min_frequency: 0.001      # categories below this training-set frequency are grouped as rare
  n_bins: 10                     # decile bins for numeric transforms
  log_skew_threshold: 2.0        # log1p applied when training-set skewness exceeds this and the column is non-negative

features:                  # Phase 3 (E2 history features); gracefully skipped if entity/time/amount are unavailable
  windows: ["1h", "24h", "7d", "30d"]
