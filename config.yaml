# Transaction Data Intelligence: configuration.
# Column hints are optional: leave them null and the framework detects roles from the data.
# Sections marked "later phase" are placeholders and are not used yet.

project:
  seed: 42
  data_dir: data
  experiments_dir: experiments
  reports_dir: reports

data:
  target: null            # e.g. is_fraud, churn
  task: null              # binary_classification | multiclass_classification | regression; null = detect
  entity_column: null     # e.g. cc_num, customer_id (used for history features)
  datetime_column: null   # event time (used for temporal splits and features)
  amount_column: null     # e.g. amt (used for E2 history/velocity features); null = detect from column names
  category_column: null   # e.g. category
  merchant_column: null   # e.g. merchant
  e0_add_time_epoch: false  # audit finding 3 (measured, not assumed): E0's raw timestamp string collapses to
                            # the tokenizer's "unknown" token for ~100% of rows (near-unique values fall below
                            # min_category_count), so E0 effectively has no time signal at all. true adds a
                            # numeric epoch-seconds column alongside the unchanged raw string. Default false
                            # until measured against the baseline the same way findings 4/5 were -- do that
                            # 3-seed comparison before ever flipping this on by default.

upload:
  save_uploads_to: data/raw   # uploaded files are stored here unchanged

schema:
  sample_size: 20000      # rows sampled for value-based detection (all rows are used for counts)

profiling:
  sample_above_rows: 500000   # above this size the UI offers profiling a reproducible sample
  sample_rows: 200000
  top_k: 5
  rare_threshold: 0.001       # categories below this share are reported as rare
  skew_warning: 2.0

quality:
  weights: null                # null = default weights (completeness .25, validity .25, consistency .20,
                                # uniqueness .15, integrity .15); a dimension with no applicable checks is
                                # excluded and the rest are re-weighted, never scored as 100
  large_dataset_warn_rows: 300000   # above this, the UI warns that quality analysis may take a while

preprocessing:                 # basic preprocessing (Phase 2): stateless, safe before any train/test split
  drop_systematic_redundant_columns: true
  drop_row_index: true
  drop_constant_columns: true
  convert_types: true
  zero_pad_codes: true
  normalize_whitespace: true
  merge_case_variants: true
  strip_shared_prefixes: true
  invalid_value_policy: nullify      # nullify | quarantine
  quarantine_missing_mandatory: true
  duplicate_policy: remove           # remove | quarantine | retain

subsets:                   # Phase 3 (Processing): reproducible subset sizes offered in the UI
  options: [10000, 50000, 100000, 200000, 500000, full]
  cpu_default: 10000

split:                     # Phase 3: train/validation/test assignment, shared by every level
  method: temporal         # temporal when a datetime column exists, otherwise falls back to random
  fractions: [0.70, 0.15, 0.15]

sampling:                  # Phase 3: fixed experiment sample per split, drawn once and reused by every level
  train_positive_share: 0.10     # oversample the positive class in train/validation so small subsets still see it
  validation_positive_share: 0.10
  keep_all_test_positives: true  # test keeps every positive it can (up to max_test_positive_share) for reliable metrics
  max_test_positive_share: 0.5

processing:                # Phase 3: E1 / E2 train-fitted transforms (missing values, rare categories, numeric)
  rare_min_frequency: 0.001      # categories below this training-set frequency are grouped as rare
  n_bins: 10                     # decile bins for numeric transforms
  log_skew_threshold: 2.0        # log1p applied when training-set skewness exceeds this and the column is non-negative

features:                  # Phase 3 (E2 history features); gracefully skipped if entity/time/amount are unavailable
  windows: ["1h", "24h", "7d", "30d"]
  include_sequence_features: true  # audit finding 5: the entity's last `sequence_length` transactions
                                    # (hours ago / amount / hour / category), point-in-time verified. This
                                    # code existed and was tested but was never wired into E2 before the audit.
  sequence_length: 3               # kept small by default for the CPU-friendly built-in transformer (more
                                    # positions = more tokens per row); raise if you have GPU budget

leakage:                   # Phase 4: feature-level leakage scan on E1 / E2's final feature set; skipped if no
                            # datetime column is set (there is nothing to hold out a "later period" with)
  high_auc: 0.99            # a single feature predicting the target this well on the later period is high risk
  medium_auc: 0.95
  instability_gap: 0.10     # predictive under random folds but this much weaker on the later period: medium risk
  holdout_fraction: 0.30    # only used as a fallback if the train/validation split boundary is unavailable

representation:            # Phase 5: turns E0/E1/E2 features into token ids, the same way for every level
  numeric_bins: 16          # quantile bins per numeric feature, fitted on training rows (numeric_mode=quantile_bin)
  min_category_count: 5     # categorical values seen fewer times than this in training become "unknown"
  max_tokens: 256           # Phase 7: prompt length budget for the language-model backends (text representation)
  numeric_mode: quantile_bin  # audit R2/R3 experiment: "quantile_bin" (default, unchanged since Phase 5) discards
                              # numeric magnitude, keeping only rank (see levels.py's finding-1 comment for why
                              # this was already a problem for the duplicated-column case). "continuous" keeps
                              # the standardized value and learns a per-feature (weight, bias) embedding for it
                              # instead of a lookup table. NOT yet measured against quantile_bin — do the same
                              # 3-seed comparison done for findings 4/5 before ever changing this default; the
                              # class_weighting revert in this file's history is exactly the cautionary tale.
  numeric_coarse_bins: 0      # only used when numeric_mode: continuous. >0 (e.g. 4) additionally gives each
                              # numeric feature a coarse quantile-bin token alongside its continuous value (the
                              # brief's Representation D); 0 is pure continuous (Representation B/R2).
  numeric_clip: 5.0           # only used when numeric_mode: continuous. Clips standardized numeric values to
                              # +/-this before they reach the model. Diagnosed necessary (audit session): some
                              # engineered ratio/z-score features have standardized values up to |z|~30; a
                              # handful of unclipped outliers measurably hurt both accuracy and seed-to-seed
                              # stability on E2 (PR-AUC 0.861->0.674, std 0.033->0.158 with no clipping;
                              # 0.674->0.838, std 0.158->0.055 with clip=5). null disables clipping.

models:
  sanity_transformer:       # Phase 5: built-in small Transformer (CPU-friendly; not meant to be state of the art)
    d_model: 64
    n_heads: 4
    n_layers: 2
    dim_feedforward: 128
    dropout: 0.1
    pooling: cls             # cls | mean
    class_weighting: none   # audit finding 4 identified a real train/eval mismatch (the sampler oversamples
                             # the positive class for training but only reweights for evaluation) and
                             # "sample_weight" (reusing the sampler's _weight as a per-example loss weight)
                             # was tried as the fix and made the DEFAULT without measuring it first — a mistake.
                             # Measured afterward (3 seeds, synthetic data): "sample_weight" caused a large,
                             # consistent PR-AUC regression on every level, confirmed in isolation on E0 alone
                             # (0.47 -> 0.14). Diagnosis: at ~0.4% true prevalence, reweighting the loss back
                             # toward the true rate makes the already-rare positive class's gradient signal
                             # negligible relative to the abundant majority class — undermining exactly what
                             # oversampling exists to provide. Reverted to "none" (the original, empirically
                             # better behaviour) as the default. "sample_weight" is kept available for direct
                             # comparison experiments (see models.sanity_transformer.class_weighting docs
                             # in the code) but is not recommended as-is for severely imbalanced data; a
                             # gentler correction (e.g. partial reweighting, or natural sampling + pos_weight,
                             # the brief's own §12 Experiment 4) is unmeasured future work, not this option.
    learning_rate: 0.0005
    batch_size: 256
    epochs: 15
    patience: 3              # stop after this many epochs without a validation PR-AUC improvement
    seed: 42

  huggingface:               # Phase 7: any compatible causal LM from the Hub, LoRA-fine-tuned on text rows.
                              # Needs transformers/peft/accelerate (optional, see requirements.txt); on CPU only,
                              # even this small a model is slow to fine-tune — use a small subset.
    model_id: gpt2
    target_modules: [c_attn]  # LoRA target modules are architecture-specific: c_attn is GPT-2's combined QKV
                              # projection; a LLaMA-family model needs [q_proj, k_proj, v_proj, o_proj, ...] instead
    load_in_4bit: false       # only applied on a CUDA GPU; ignored on CPU
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    epochs: 1
    batch_size: 8
    gradient_accumulation_steps: 2
    learning_rate: 0.0002
    seed: 42
    eval_every_steps: 50
    checkpoint_every_steps: 50

  nemotron:                  # Phase 7: requires a CUDA GPU with enough memory (e.g. Colab T4); not usable on
                              # CPU-only machines — availability() reports this honestly rather than pretending.
    model_id: nvidia/Llama-3.1-Nemotron-Nano-4B-v1.1
    min_gpu_memory_gb: 12
    load_in_4bit: true
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    epochs: 1
    batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 0.0002
    seed: 42
    eval_every_steps: 50
    checkpoint_every_steps: 50

  api:                       # Phase 7: your own model behind an HTTP endpoint (inference only; no local training)
    endpoint: null            # e.g. https://your-service/predict ; null = unavailable until you set this
    batch_size: 32
    timeout_seconds: 30
